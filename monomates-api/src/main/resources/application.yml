spring:
  application:
    name: monomates-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/monomates}
    username: ${DATABASE_USERNAME:monomates}
    password: ${DATABASE_PASSWORD:monomates_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  auth:
    issuer: monomates-api
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-1234567890}
    access-token-minutes: 120
    cookie-name: mm_access_token
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  deposit:
    session-seconds: 60
    minimum-weight-grams: 5.0
    minimum-classification-confidence: 0.70
    daily-scan-limit: 10
  demo:
    secret-account-email: ${DEMO_SECRET_ACCOUNT_EMAIL:demo@monomates.app}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
    api-requests-per-minute: ${API_RATE_LIMIT_PER_MINUTE:300}
